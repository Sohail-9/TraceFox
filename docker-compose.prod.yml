version: "3.10"

services:
  # ---------------------------------------------------------------------------
  # Core Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tracefox-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file: .env
    expose:
      - "6379"
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: postgres:15-alpine
    container_name: tracefox-database
    env_file: .env
    environment:
      POSTGRES_USER: ${TRACEFOX_POSTGRES__USER}
      POSTGRES_PASSWORD: ${TRACEFOX_POSTGRES__PASSWORD}
      POSTGRES_DB: ${TRACEFOX_POSTGRES__DATABASE}
    expose:
      - "5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACEFOX_POSTGRES__USER} -d ${TRACEFOX_POSTGRES__DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.22
    container_name: tracefox-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    expose:
      - "7474"
      - "7687"
    restart: always
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: tracefox-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${TRACEFOX_MESSAGING__USER:-tracefox}
      RABBITMQ_DEFAULT_PASS: ${TRACEFOX_MESSAGING__PASSWORD:-tracefox}
    expose:
      - "5672"
      - "15672"
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracefox-backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      neo4j:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracefox-frontend
    restart: always
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:
  rabbitmq_data:
