version: "3.10"

services:
  redis:
    image: redis:7-alpine
    container_name: tracefox-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: tracefox-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${TRACEFOX_POSTGRES__USER}
      POSTGRES_PASSWORD: ${TRACEFOX_POSTGRES__PASSWORD}
      POSTGRES_DB: ${TRACEFOX_POSTGRES__DATABASE}
    ports:
      - "${TRACEFOX_POSTGRES__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.22
    container_name: tracefox-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: tracefox-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  postgres_data:
